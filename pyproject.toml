[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconlab-research"
version = "2.2"
description = "Synthetic HTTP/S traffic lab for evaluating periodicity-based detection rules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
beaconlab = "beaconlab.__main__:main"

[tool.setuptools]
packages = ["beaconlab"]
